<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QWERTYgroove</title>
<style>
  :root {
    --bg: #aebab8;
    --bg-2: #b7c2c0;
    --ink: #383b3e;
    --ink-2: #2a2d2f;
    --muted: #5a6264;
    --panel: #2e3133;
    --teal: #1fc4b4;
    --teal-ink: #102421;
    --hole-white: #e9f4f2;
    --sans: "Helvetica Neue", "Inter", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, "DejaVu Sans Mono", monospace;
    --glow: 0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); height: 100%; }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; }

  .brand { display: flex; flex-direction: column; align-items: center; padding: 20px 16px 0; }
  .brand svg { width: 340px; max-width: 80vw; height: auto; display: block; }
  main { flex: 1; width: 100%; max-width: 820px; margin: 0 auto; padding: 16px 16px 46px;
    display: flex; flex-direction: column; justify-content: center; }

  /* ---------- the figure: keyboard drawing + punch-card equalizer ---------- */
  .fig { position: relative; height: clamp(160px, calc(100vh - 430px), 400px); aspect-ratio: 1.55 / 1; max-width: 100%;
    margin: 0 auto; border: 1.5px solid var(--ink-2); overflow: hidden; background: var(--bg-2); flex: none; }
  .fig .dark { position: absolute; inset: 0 52% 0 0; background: var(--panel); }
  .fig svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .fig .num { position: absolute; left: 3.5%; top: 3%; font: 300 clamp(16px, 4.5vh, 36px)/1 var(--sans); color: #d5dcdb; }
  .fig .figlabel {
    position: absolute; right: 2.5%; bottom: 3%;
    font: 400 clamp(11px, 2.4vh, 20px)/1 var(--mono); letter-spacing: .12em; color: var(--ink-2);
  }
  .card {
    position: absolute; left: 21%; right: 22%; top: 17%; bottom: 0; background: var(--teal); color: var(--teal-ink);
    padding: 2.2% 1.6% 0; display: flex; flex-direction: column; font-family: var(--mono);
    box-shadow: 0 0 calc(var(--glow) * 40px) calc(var(--glow) * 6px) rgba(120, 255, 235, calc(var(--glow) * .35));
  }
  .card .head { display: grid; grid-template-columns: repeat(8, 1fr); text-align: center;
    font-size: clamp(6px, 1.25vh, 11px); letter-spacing: .08em; opacity: .55; margin-bottom: 1.5%; }
  .grid { flex: 1; display: grid; grid-template-columns: repeat(24, 1fr); grid-auto-rows: 1fr;
    align-items: center; justify-items: center; font-size: clamp(7px, 1.6vh, 14px); font-weight: 600; }
  .grid i { font-style: normal; width: 62%; height: 74%; display: flex; align-items: center; justify-content: center; border-radius: 999px; }
  .grid i.p { background: var(--teal-ink); color: transparent; }
  .grid i.w { background: var(--hole-white); color: transparent; }
  .grid .cols { font-size: .7em; font-weight: 500; opacity: .8; }

  /* ---------- steps + headline ---------- */
  .steps { display: flex; justify-content: center; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .step { background: transparent; cursor: pointer; border: 1.5px solid var(--ink-2); padding: 6px 11px 5px; font: 400 14px/1 var(--mono); letter-spacing: .03em; color: var(--ink-2); }
  .step.on { background: #303436; border-color: #303436; color: #e7ecea; }
  .step.done { opacity: .55; }
  .step:hover { background: rgba(255, 255, 255, .18); opacity: 1; }
  .step.on:hover { background: #303436; }
  h1 { text-align: center; font: 500 clamp(34px, 8vh, 76px)/.95 var(--sans); letter-spacing: -.05em;
    color: var(--ink); margin: 14px auto 8px; overflow-wrap: anywhere; }
  .status { text-align: center; font: 400 16px/1.45 var(--sans); color: var(--muted); max-width: 560px; margin: 0 auto; min-height: 46px; white-space: pre-line; }
  .status.err { color: #7a2a1f; font-weight: 500; }

  .actions { display: flex; justify-content: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; min-height: 46px; }
  .btn { border: 1.5px solid var(--ink-2); background: transparent; padding: 14px 22px 13px; cursor: pointer;
    font: 500 14px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
  .btn.dark { background: var(--panel); color: #eef3f2; }
  .btn:hover { background-color: rgba(255, 255, 255, .15); }
  .btn.dark:hover { background: #3a3e41; }

  .note { position: fixed; left: 16px; bottom: 18px; max-width: calc(100% - 230px);
    font: 500 14px/1.35 var(--sans); color: var(--ink); }

  .credit {
    position: fixed; right: 14px; bottom: 14px; z-index: 10;
    background: #303436; color: #e7ecea; padding: 7px 11px 6px;
    font: 400 12px/1 var(--mono); letter-spacing: .04em;
  }

  @media (max-width: 640px) {
    .fig { height: auto; width: min(100%, max(200px, calc((100vh - 440px) * 1.1))); aspect-ratio: 1.1 / 1; }
    .note { display: none; }
    .card { left: 8%; right: 8%; top: 22%; }
    .btn { flex: 1 1 40%; padding: 13px 10px 12px; }
  }
</style>
</head>

  <figure class="fig" aria-label="Live view of your keyboard light">
    <div class="dark"></div>
    <svg viewBox="0 0 1000 645" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-38)">
          <line x1="0" y1="0" x2="0" y2="9" stroke="#c3cccb" stroke-width="1.1"/>
        </pattern>
        <pattern id="hatch-d" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(52)">
          <line x1="0" y1="0" x2="0" y2="8" stroke="#2a2d2f" stroke-width=".9"/>
        </pattern>
      </defs>
      <g fill="none" stroke="#c3cccb" stroke-width="1.4" stroke-linejoin="round">
        <path d="M40 300 L455 250 L470 610 L60 640 Z"/>
        <path d="M52 312 L447 264 L459 520 L68 552 Z" stroke-dasharray="4 4" opacity=".6"/>
        <g id="keys"></g>
        <path d="M60 640 L40 300" stroke-width="2.2"/>
        <rect x="20" y="150" width="190" height="110" fill="url(#hatch)" stroke="none" opacity=".55"/>
        <path d="M30 140 L210 140 L210 260"/>
        <path d="M30 235 L170 235 L170 290"/><path d="M162 278 L170 292 L178 278"/>
        <text x="110" y="225" fill="#c3cccb" stroke="none" font-family="ui-monospace, Menlo, monospace" font-size="15">KBD-01</text>
        <path d="M300 60 q60 -30 120 0"/><path d="M300 60 l-6 18"/>
        <text x="318" y="100" fill="#c3cccb" stroke="none" font-family="ui-monospace, Menlo, monospace" font-size="15" transform="rotate(-90 318 100)">766</text>
      </g>
      <g fill="none" stroke="#2a2d2f" stroke-width="1.2">
        <g id="cone">
          <circle cx="805" cy="300" r="205" stroke-width="1.8"/>
          <g id="spin">
            <!-- grooves with small breaks, so you can see the record turning -->
            <circle cx="805" cy="300" r="188" stroke-dasharray="210 9 90 6 400 12" opacity=".75"/>
            <circle cx="805" cy="300" r="170" stroke-dasharray="5 4"/>
            <circle cx="805" cy="300" r="152" stroke-dasharray="300 10 120 8 300" opacity=".75"/>
            <circle cx="805" cy="300" r="134" stroke-dasharray="160 7 60 7 380" opacity=".75"/>
            <circle cx="805" cy="300" r="116" stroke-dasharray="420 12 150" opacity=".75"/>
            <circle cx="805" cy="300" r="96"/>
            <circle cx="805" cy="300" r="52" fill="url(#hatch-d)"/>
            <path d="M805 248 L805 276" stroke-width="3"/>
            <text x="805" y="336" text-anchor="middle" fill="#2a2d2f" stroke="none"
                  font-family="ui-monospace, Menlo, monospace" font-size="13">33⅓</text>
            <circle cx="805" cy="300" r="22"/>
            <circle cx="805" cy="300" r="4" fill="#2a2d2f"/>
          </g>
        </g>
        <!-- tonearm: drops onto the record when music plays -->
        <g id="arm">
          <circle cx="968" cy="92" r="15"/><circle cx="968" cy="92" r="5" fill="#2a2d2f"/>
          <path d="M968 92 L938 318 L900 366" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M889 356 L912 376 L903 386 L880 366 Z" fill="#2a2d2f"/>
          <path d="M968 77 L968 50" stroke-width="2"/><rect x="958" y="34" width="20" height="16" fill="url(#hatch-d)"/>
        </g>
        <path d="M600 300 L1010 300" stroke-dasharray="10 5 2 5" opacity=".7"/>
        <path d="M805 70 L805 560" stroke-dasharray="10 5 2 5" opacity=".7"/>
        <path d="M640 120 l40 -40 l40 0"/>
      </g>
    </svg>
    <div class="num">— 170</div>
    <div class="card"><div class="head" id="head"></div><div class="grid" id="grid"></div></div>
    <div class="figlabel">FIG. 01</div>
  </figure>

  <div class="steps">
    <button class="step" id="s1" data-a="demo">01 Demo</button>
    <button class="step" id="s2" data-a="spotify">02 Your groove</button>
  </div>
  <h1 id="title">QWERTYgroove</h1>
  <p class="status" id="status">Getting ready…</p>
  <div class="actions" id="actions"></div>

</main>
<div class="note">Made for M-series MacBooks (M1 and newer) with a backlit keyboard</div>
<div class="credit">Developed by z.ahmed</div>

<script>
const $ = (s) => document.querySelector(s);
const ROWS = 8, COLS = 24;

// ---------- punch card ----------
$("#head").innerHTML = ["KICK", "BASS", "SNRE", "VOX", "LEAD", "SNAP", "HATS", "CYMB"].map((h) => `<span>${h}</span>`).join("");
const cells = [];
for (let r = 0; r < ROWS + 1; r++) for (let c = 0; c < COLS; c++) {
  const i = document.createElement("i");
  if (r === 1) { i.className = "cols"; i.textContent = String(c + 1).padStart(2, "0"); }
  else i.textContent = r === 0 ? "0" : String(r - 1);
  $("#grid").appendChild(i);
  if (r !== 1) (cells[c] ||= []).push(i);
}

// ---------- keys on the drawing (they glow with your real keyboard) ----------
const keyEls = [];
for (let row = 0; row < 5; row++) for (let k = 0; k < 11; k++) {
  const P = (u, v) => {
    const top = [62 + 385 * u, 314 - 48 * u], bot = [70 + 388 * u, 550 - 32 * u];
    return [top[0] + (bot[0] - top[0]) * v, top[1] + (bot[1] - top[1]) * v];
  };
  const g = 0.12, t = k / 11, t2 = (k + 1) / 11, y0 = row / 5, y1 = (row + 1) / 5;
  const pts = [P(t + g / 11, y0 + g / 5), P(t2 - g / 11, y0 + g / 5), P(t2 - g / 11, y1 - g / 5), P(t + g / 11, y1 - g / 5)];
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", "M" + pts.join(" L") + " Z");
  $("#keys").appendChild(p); keyEls.push(p);
}

// ---------- app ----------
const post = (path, body = {}) => fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
  body: JSON.stringify(body) }).then((r) => r.json()).catch(() => ({}));
let info = { spotify_ready: true, spotify_message: "" };
const loadInfo = () => fetch("/api/info").then((r) => r.json()).then((d) => {
  info = d;
});
loadInfo();

let step = "demo", latest = null, started = false, uiKey = "";
const start = (src) => { step = src === "spotify" ? "spotify" : "demo"; uiKey = ""; post("/api/start", { source: src }); };
const ACTIONS = {
  demo: () => start("demo"),
  spotify: () => loadInfo().then(() => start("spotify")),
  stop: () => post("/api/stop"),
};
$("#actions").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) ACTIONS[b.dataset.a](); });
document.querySelectorAll(".step").forEach((b) => b.addEventListener("click", () => {
  const running = latest && latest.running && latest.kind === b.dataset.a;
  if (!running) ACTIONS[b.dataset.a]();          // clicking the one already playing does nothing
}));

const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const btn = (a, text, dark) => `<button class="btn${dark ? " dark" : ""}" data-a="${a}">${text}</button>`;

let demoTitle = "Funkorama";
function render(s) {
  let title, status, actions, err = false;
  if (s.running && s.kind === "demo" && s.title) demoTitle = s.title;
  // while switching, show the new screen straight away (unless the demo is still downloading)
  if (s.busy && !/Grabbing/.test(s.status || "")) {
    s = { ...s, busy: false, error: null, running: true, kind: step === "spotify" ? "spotify" : "demo", title: demoTitle };
  }
  if (s.busy) {
    title = step === "spotify" ? "Your groove" : "Demo";
    status = s.status; actions = "";
  } else if (s.error) {
    title = step === "spotify" ? "Your groove" : "Demo";
    status = s.error; err = true;
    actions = step === "spotify" ? btn("spotify", "Try again", true) + btn("demo", "Play demo") : btn("demo", "Try again", true);
  } else if (s.running && s.kind === "demo") {
    title = s.title;
    status = "Watch your keyboard groove.\nA little funk to get you started.";
    actions = btn("spotify", "Next: your groove →", true) + btn("stop", "Stop");
  } else if (s.running && s.kind === "spotify") {
    title = "Your groove";
    status = "Play anything on Spotify, Apple Music or YouTube\nand watch your keyboard groove.";
    actions = btn("stop", "Stop", true) + btn("demo", "Play demo");
  } else if (step === "spotify" && !info.spotify_ready) {
    title = "Your groove";
    status = info.spotify_message; err = true;
    actions = btn("spotify", "Try again", true) + btn("demo", "Play demo");
  } else {
    const done = s.status === "Finished";
    title = done ? "That's the demo." : "Ready when you are.";
    status = done ? "Now try it with your own music." : "Play the demo, or start your groove.";
    actions = btn("spotify", "Start my groove →", true) + btn("demo", "Play demo");
  }
  $("#title").textContent = title;
  const st = $("#status"); st.textContent = status; st.classList.toggle("err", err);
  if (actions !== uiKey) { uiKey = actions; $("#actions").innerHTML = actions; }
  $("#s1").className = "step" + (step === "demo" ? " on" : " done");
  $("#s2").className = "step" + (step === "spotify" ? " on" : "");
}

function draw(s) {
  s.bands.forEach((b, i) => {
    const lv = Math.pow(b.level, 2.2);
    [lv * 0.85, Math.max(lv, b.env * 0.9), lv * 0.7].forEach((v, j) => {
      const n = Math.round(Math.min(1, v) * ROWS);
      cells[i * 3 + j].forEach((cell, r) => {
        const fb = ROWS - 1 - r, punched = fb < n;
        const cls = punched && fb === n - 1 && b.env > 0.45 && j === 1 ? "w" : punched ? "p" : "";
        if (cell.className !== cls) cell.className = cls;
      });
    });
  });
  document.documentElement.style.setProperty("--glow", s.light.toFixed(3));
  const fill = `rgba(150,255,240,${(s.light * 0.85).toFixed(3)})`;
  keyEls.forEach((k) => k.setAttribute("fill", fill));
  const sc = 1 + s.bands[0].env * 0.04;
  $("#cone").setAttribute("transform", `translate(805 300) scale(${sc.toFixed(3)}) translate(-805 -300)`);
}

// closing the tab/window stops the music and the keyboard light straight away
addEventListener("pagehide", () => { try { navigator.sendBeacon("/api/bye", "{}"); } catch (e) {} });

const es = new EventSource("/api/stream");
es.onmessage = (e) => {
  latest = JSON.parse(e.data);
  if (!started) {                      // open straight into the demo
    started = true;
    if (!latest.running && !latest.busy) start("demo");
    else if (latest.kind === "spotify") step = "spotify";
  }
};
es.onerror = () => {
  latest = null;
  $("#status").textContent = "QWERTYgroove has closed. Type qwertygroove in Terminal to open it again.";
  $("#actions").innerHTML = ""; uiKey = "";
};

// record player: spins at 33⅓ rpm while music plays, winds down when it stops
let spinAngle = 0, spinSpeed = 0, armAngle = -15, lastT = performance.now();
function turntable(playing) {
  const now = performance.now(), dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  const target = playing ? 200 : 0;                         // degrees per second
  spinSpeed += (target - spinSpeed) * Math.min(1, dt * (playing ? 2.2 : 1.1));
  spinAngle = (spinAngle + spinSpeed * dt) % 360;
  armAngle += ((playing ? 0 : -15) - armAngle) * Math.min(1, dt * 3);
  $("#spin").setAttribute("transform", `rotate(${spinAngle.toFixed(2)} 805 300)`);
  $("#arm").setAttribute("transform", `rotate(${armAngle.toFixed(2)} 968 92)`);
}

(function frame() {
  if (latest) { draw(latest); render(latest); }
  turntable(!!(latest && (latest.running || latest.busy)));
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
